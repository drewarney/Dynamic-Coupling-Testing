name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The reference tier is dependency-free by design, so the full
      # verification + optimisation suite runs in CI with no licences.
      - name: Run tests
        run: pytest -q --durations=10

      - name: Smoke-test the examples
        run: |
          python examples/01_modal_mvp.py
          python examples/02_coupling_analysis.py
