[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dynopt"
version = "0.1.0"
description = "Automated dynamic coupling and resonance optimization for parametric CAD"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
# Open-source CAD/FEA path. CalculiX (ccx) is a system binary, not a wheel.
oss = ["cadquery>=2.4", "gmsh>=4.11", "meshio>=5.3"]
# Ansys path (requires a local/academic MAPDL install + license).
ansys = ["ansys-mapdl-core>=0.68", "ansys-mapdl-reader>=0.53"]
ml = ["torch>=2.1", "xgboost>=2.0"]
viz = ["matplotlib>=3.7", "pyvista>=0.43"]
dev = ["pytest>=7.4", "pytest-cov"]

[project.scripts]
dynopt = "dynopt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["slow: meshes or solves for minutes; deselect with -m 'not slow'"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
# Put src/ on sys.path for the test run. Without this the suite depends
# entirely on the editable install staying intact, and when anything disturbs
# it every test module fails at collection with ModuleNotFoundError -- a
# failure mode that looks like broken code and is broken environment.
# `pip uninstall dynopt -y && pytest -q` must pass.
pythonpath = ["src"]
